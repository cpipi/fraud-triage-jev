[project]
name = "fraud-triage-jev"
version = "1.0.0"
description = "Fraud alert triage on TypeSafe's Jev decision model, benchmarked against GPT-4o-mini on PaySim-seeded alerts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.5.0",
]

[dependency-groups]
notebooks = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.0",
]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
